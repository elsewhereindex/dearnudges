# Refresh the homepage number block.
#
# Only `hellos` actually moves here. `languages` is read from SHIP_LANGS in the
# friendo repo, which is private and not checked out on this runner, so
# build_stats.py keeps the committed value; `countries` and `accounts` are
# constants. That is deliberate: a language or territory change is a release,
# and a release is where those two get re-checked.
#
# The commit is gated on `hellos` changing. build_stats.py always rewrites the
# `updated` field, so committing unconditionally would push an empty change
# every single day and bury the real ones.
name: stats

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily, off the hour to dodge the rush
  workflow_dispatch:           # so it can be run by hand after a big day

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the current count
        id: before
        run: echo "hellos=$(python3 -c "import json;print(json.load(open('stats.json'))['hellos'])")" >> "$GITHUB_OUTPUT"

      # This job has been passing green while measuring nothing. Without the
      # key, build_stats.py correctly keeps the existing figure rather than
      # writing a zero, the number never changes, no commit happens, and the
      # run reports success. Green-while-blind is the same failure that made an
      # empty Sentry dashboard feel reassuring. Say so on the run instead.
      - name: Rebuild stats.json
        env:
          TELEMETRYDECK_API_KEY: ${{ secrets.TELEMETRYDECK_API_KEY }}
        run: |
          if [ -z "${TELEMETRYDECK_API_KEY}" ]; then
            echo "::warning title=Homepage stats are frozen, and cannot be unfrozen by adding a secret::TELEMETRYDECK_API_KEY is a TelemetryDeck PERSONAL ACCESS TOKEN, which is a PAID feature. Dear's organisation is on the free plan (verified 2026-09-23: 4,262 of 100,000 events used, so volume is not the issue), so this token CANNOT be issued. Do not keep filing this as a missing secret. The Hellos number on the live site is whatever was last committed, and stays that way until either Dear moves to a paid TelemetryDeck plan or the number is updated by hand."
          fi
          python3 tools/build_stats.py

      - name: Read the new count
        id: after
        run: echo "hellos=$(python3 -c "import json;print(json.load(open('stats.json'))['hellos'])")" >> "$GITHUB_OUTPUT"

      # Without the key, build_stats.py keeps the existing figure rather than
      # writing a zero. That is the right behaviour, and it also means this
      # step correctly does nothing until the secret is placed.
      - name: Commit when the number moved
        if: steps.before.outputs.hellos != steps.after.outputs.hellos
        run: |
          git config user.name  "dear-stats"
          git config user.email "noreply@dearnudges.com"
          git add stats.json
          git commit -m "stats: hellos ${{ steps.before.outputs.hellos }} -> ${{ steps.after.outputs.hellos }}"
          git push
