<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get Dear</title>
<meta name="robots" content="noindex">
<meta name="description" content="One person a day, before you lose touch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  :root{ --cream:#F5F2EB; --ink:#171C29; --nile:#6B8AD6; --mute:#6E6A61; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100svh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:32px 26px calc(32px + env(safe-area-inset-bottom))}
  h1{font-size:clamp(30px,8vw,46px);font-weight:800;letter-spacing:-.035em;
    line-height:1.06;margin:0 0 14px;max-width:14ch;text-wrap:balance}
  p{font-size:clamp(15px,4vw,18px);line-height:1.45;color:var(--mute);margin:0 0 34px;max-width:30ch}
  .btn{display:block;width:100%;max-width:340px;padding:18px 22px;border-radius:14px;
    background:var(--nile);color:#fff;text-decoration:none;font-weight:600;font-size:17px;
    margin:0 0 12px;transition:transform .12s ease}
  .btn:active{transform:scale(.985)}
  .btn.alt{background:transparent;color:var(--nile);border:1.5px solid rgba(107,138,214,.4);font-weight:600}
  .mark{font-size:12px;letter-spacing:.22em;color:var(--nile);font-weight:800;margin-bottom:30px}
  .note{font-size:13px;color:var(--mute);margin-top:18px}
  .note a{color:var(--mute)}
  /* Both buttons show by default so the page works with JS off. Detection
     hides the irrelevant one rather than revealing the relevant one. */
  .hide{display:none}
</style>
</head>
<body>
<main>
  <div class="mark">DEAR</div>
  <h1>One person a day, before you lose touch.</h1>
  <p>Text, call, done. No feed, no accounts, free to start.</p>

  <a class="btn" id="ios" href="https://apps.apple.com/app/id6760280035">Get it on iPhone</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.elsewhere.dear">Get it on Android</a>

  <div class="note"><a href="/">More about Dear</a></div>
</main>
<script>
  // Show one button on mobile, both on desktop. iPadOS reports as Mac, so the
  // touch check is what separates an iPad from a laptop.
  (function () {
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (isIOS)     document.getElementById('android').classList.add('hide');
    if (isAndroid) document.getElementById('ios').classList.add('hide');
    if (isIOS || isAndroid) {
      var b = document.getElementById(isIOS ? 'ios' : 'android');
      b.textContent = 'Get Dear, free';
    }
  })();
</script>
</body>
</html>
